name: 构建并发布应用

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 使用 PyInstaller 构建可执行文件
      run: |
        # 查找 customtkinter 软件包路径
        $ctk_path = python -c "import os, customtkinter; print(os.path.dirname(customtkinter.__file__))"
        echo "CustomTkinter Path: $ctk_path"

        # 使用全部必要参数运行 PyInstaller
        # PyInstaller 的 onefile 内置压缩已启用。
        # 不使用 UPX，避免启动时解压 Python/Tk 运行库导致启动变慢。
        # --optimize=2：优化 Python 字节码，减少体积且不影响运行时性能。
        pyinstaller --noconsole --onefile --name "fishtest-worker-gui-i18n" `
          --icon="assets/icon.ico" `
          --add-data "assets;assets" `
          --add-data "$ctk_path;customtkinter" `
          --noupx `
          --optimize=2 `
          main.py

        # 显示压缩后的文件大小
        $exe = Get-Item "dist\fishtest-worker-gui-i18n.exe"
        echo "最终 EXE 大小: $([math]::Round($exe.Length / 1MB, 2)) MB"

    - name: 创建 GitHub Release 并上传构建产物
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 上传构建产物（仅用于测试）
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: fishtest-worker-gui-i18n
        path: dist/*.exe
