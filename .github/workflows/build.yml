name: 构建并发布应用

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: 检出仓库
      uses: actions/checkout@v6

    - name: 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 安装 UPX
      shell: pwsh
      run: |
        $upxVersion = "5.0.2"
        $url = "https://github.com/upx/upx/releases/download/v$upxVersion/upx-$upxVersion-win64.zip"
        $zip = Join-Path $env:RUNNER_TEMP "upx.zip"
        $dest = Join-Path $env:RUNNER_TEMP "upx"
        Invoke-WebRequest -Uri $url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $dest -Force
        $upxDir = Get-ChildItem $dest -Directory | Select-Object -First 1
        echo "$($upxDir.FullName)" >> $env:GITHUB_PATH

    - name: 使用 PyInstaller 构建可执行文件
      env:
        PYTHONOPTIMIZE: "2"
      run: |
        pyinstaller --noconfirm --clean fishtest-worker-gui.spec
        $exe = "dist/fishtest-worker-gui.exe"
        if (-not (Test-Path $exe)) { throw "未生成 $exe" }
        python tools/pack_exe.py $exe

    - name: 创建 GitHub Release 并上传构建产物
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 上传构建产物（仅用于测试）
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v5
      with:
        name: fishtest-worker-gui
        path: dist/*.exe
